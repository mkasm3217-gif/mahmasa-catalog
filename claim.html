<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>استلام تجهيز الطلب</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f1ed;color:#2f211a;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:18px}.card{width:min(100%,440px);background:#fff;border:1px solid #e8ddd2;border-radius:18px;padding:24px;box-shadow:0 14px 40px #2f211a12}h1{font-size:22px;margin:0 0 8px}p{line-height:1.7;color:#69594c}label{display:grid;gap:7px;margin:16px 0;font-size:14px}input{font:inherit;border:1px solid #d7c9bd;border-radius:10px;padding:12px}button{width:100%;border:0;border-radius:10px;background:#2f211a;color:#fff;font:inherit;font-weight:700;padding:13px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#result{min-height:1.5em;margin-bottom:0}
  </style>
</head>
<body>
  <main class="card">
    <h1>استلام تجهيز الطلب</h1>
    <p>يسجل هذا الرابط أول موظف يعلن استعداده لتجهيز الطلب. لا تفتحه إلا إذا كنت ستتولى تجهيز الطلب فعلًا.</p>
    <form id="claimForm">
      <label for="claimName">اسمك</label>
      <input id="claimName" maxlength="120" autocomplete="name" required placeholder="اكتب اسمك">
      <button id="claimButton" type="submit">استلم تجهيز الطلب</button>
    </form>
    <p id="result" role="status" aria-live="polite"></p>
  </main>
  <script>
    const form = document.getElementById("claimForm");
    const result = document.getElementById("result");
    const button = document.getElementById("claimButton");
    const token = new URLSearchParams(location.search).get("token") || "";
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      result.textContent = "جاري تسجيل الاستلام...";
      try {
        const response = await fetch("/api/orders/staff-claim", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, name: document.getElementById("claimName").value.trim() }),
          cache: "no-store"
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.message || "تعذر تسجيل الاستلام.");
        result.textContent = data.message;
        form.hidden = true;
      } catch (error) {
        result.textContent = error.message;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
